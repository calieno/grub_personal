# GRUB Advanced Options Menu
set theme=($root)/grub/themes/vimix/theme_advanced.txt
export theme

menuentry 'Arch Linux (Kernel LTS - Modo de Recuperação)' --class arch --class gnu-linux --class gnu --class os {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod btrfs
    search --no-floppy --fs-uuid --set=root 9d50f516-f04a-4dfa-9669-b4686ce2b777
    echo 'Carregando o Linux linux-lts em modo de recuperação...'
    linux /@/boot/vmlinuz-linux-lts root=UUID=9d50f516-f04a-4dfa-9669-b4686ce2b777 rw rootflags=subvol=@ single
    echo 'Carregando o ramdisk inicial...'
    initrd /@/boot/intel-ucode.img /@/boot/initramfs-linux-lts.img
}

if [ "$grub_platform" = "efi" ]; then
    menuentry 'Windows (Modo de Segurança / Recuperação)' --class windows --class os {
        insmod part_gpt
        insmod fat
        search --no-floppy --fs-uuid --set=root 7A8D-8E62
        chainloader /efi/Microsoft/Boot/bootmgfw.efi
    }

    menuentry 'UEFI Firmware Settings (Setup BIOS)' --class efi --class settings {
        fwsetup
    }
fi

if [ -f "${prefix}/grub-btrfs.cfg" ]; then
    submenu 'Arch Linux snapshots (Timeshift)' --class timeshift --class recovery {
        configfile "${prefix}/grub-btrfs.cfg"
    }
fi

menuentry '<- Voltar ao menu principal [Esc / Espaço]' --class cancel --hotkey " " {
    configfile /boot/grub/grub.cfg
}
