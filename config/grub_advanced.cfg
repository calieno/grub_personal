# GRUB Advanced Options Menu
if [ -f "${prefix}/themes/vimix/theme_advanced.txt" ]; then
    set theme="${prefix}/themes/vimix/theme_advanced.txt"
elif [ -f "($root)/grub/themes/vimix/theme_advanced.txt" ]; then
    set theme="($root)/grub/themes/vimix/theme_advanced.txt"
elif [ -f "/boot/grub/themes/vimix/theme_advanced.txt" ]; then
    set theme="/boot/grub/themes/vimix/theme_advanced.txt"
fi
export theme

menuentry 'Arch Linux (Kernel LTS - Modo de Recuperação)' --class arch --class gnu-linux --class gnu --class os {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod fat
    insmod btrfs
    search --no-floppy --fs-uuid --set=root {{BOOT_UUID}}
    echo 'Carregando o Linux linux-lts em modo de recuperação...'
    linux {{BOOT_PATH}}/vmlinuz-linux-lts root=UUID={{ROOT_UUID}} rw rootflags=subvol=@ single
    echo 'Carregando o ramdisk inicial...'
    initrd {{BOOT_PATH}}/intel-ucode.img {{BOOT_PATH}}/initramfs-linux-lts.img
}

if [ "$grub_platform" = "efi" ]; then
    menuentry 'Windows (Modo de Segurança / Recuperação)' --class windows --class os {
        insmod part_gpt
        insmod fat
        search --no-floppy --fs-uuid --set=root {{WIN_EFI_UUID}}
        chainloader /efi/Microsoft/Boot/bootmgfw.efi
    }

    menuentry 'UEFI Firmware Settings (Setup BIOS)' --class efi --class settings {
        fwsetup
    }
fi

if [ -f "${prefix}/grub-btrfs.cfg" ]; then
    submenu 'Arch Linux snapshots (Timeshift)' --class timeshift --class recovery {
        configfile "${prefix}/grub-btrfs.cfg"
    }
elif [ -f "/grub/grub-btrfs.cfg" ]; then
    submenu 'Arch Linux snapshots (Timeshift)' --class timeshift --class recovery {
        configfile "/grub/grub-btrfs.cfg"
    }
elif [ -f "/boot/grub/grub-btrfs.cfg" ]; then
    submenu 'Arch Linux snapshots (Timeshift)' --class timeshift --class recovery {
        configfile "/boot/grub/grub-btrfs.cfg"
    }
fi

menuentry '<- Voltar ao menu principal [Esc / Espaço]' --class cancel --hotkey " " {
    if [ -f "${prefix}/grub.cfg" ]; then
        configfile "${prefix}/grub.cfg"
    elif [ -f "/grub/grub.cfg" ]; then
        configfile "/grub/grub.cfg"
    elif [ -f "/boot/grub/grub.cfg" ]; then
        configfile "/boot/grub/grub.cfg"
    fi
}
